version: '3.8'

services:
  # ======== 后端服务 ========
  dbm-lite-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbm-lite-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DBM_LITE_SERVER_PORT=8080
      - DBM_LITE_DB_PATH=/app/data/dbm-lite.db
      - DBM_LITE_JWT_SECRET=${DBM_LITE_JWT_SECRET:-dbm-lite-default-jwt-secret-change-me}
      - DBM_LITE_AES_KEY=${DBM_LITE_AES_KEY:-dbm-lite-aes-key-change-me-32-bytes!!}
      - DBM_LITE_ADMIN_USERNAME=${DBM_LITE_ADMIN_USERNAME:-admin}
      - DBM_LITE_ADMIN_PASSWORD=${DBM_LITE_ADMIN_PASSWORD:-admin123}
      - DBM_LITE_TOKEN_TTL_SECONDS=86400
    volumes:
      - dbm-lite-backend-data:/app/data
    networks:
      - dbm-lite-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ======== 前端服务 ========
  dbm-lite-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbm-lite-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    depends_on:
      - dbm-lite-backend
    networks:
      - dbm-lite-net

volumes:
  dbm-lite-backend-data:
    name: dbm-lite-backend-data

networks:
  dbm-lite-net:
    name: dbm-lite-net
    driver: bridge
